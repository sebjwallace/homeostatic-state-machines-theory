[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Experiment 02 measurement harness: corpus, baselines, tests, report."

[lib]
path = "src/lib.rs"

[[bin]]
name = "run"
path = "src/bin/run.rs"

[dependencies]
hsm-core = { path = "../core" }
# Models. Add one line per model crate here (and one line in src/bin/run.rs).
m000-reference = { path = "../models/m000-reference" }
m003-shared-assemblies = { path = "../models/m003-shared-assemblies" }
m004-held-state = { path = "../models/m004-held-state" }
