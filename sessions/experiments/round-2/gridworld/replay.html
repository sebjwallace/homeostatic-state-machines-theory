<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid world replay</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #dcdad3;
  --accent: #c2410c; --felt: #2563eb; --inner: #7c3aed; --cursor: #111;
  --floor: #ecebe6; --wall: #3b3a36;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a988f; --line: #34332f;
    --accent: #fb923c; --felt: #60a5fa; --inner: #a78bfa; --cursor: #fff;
    --floor: #2a2a26; --wall: #85837a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 14px 16px 6px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
h1 { font-size: 17px; margin: 0; font-weight: 600; }
#meta { color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, auto) minmax(260px, 1fr); gap: 16px; padding: 8px 16px 16px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
#gridWrap { display: flex; justify-content: center; }
canvas { display: block; max-width: 100%; }
#chart { width: 100%; height: 150px; cursor: crosshair; touch-action: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
button, select, input[type=range] { font: inherit; }
button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; min-width: 36px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 72px; }
#scrub { flex: 1 1 200px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-variant-numeric: tabular-nums; }
dt { color: var(--muted); }
dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
#drop { border: 2px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center; color: var(--muted); margin: 8px 16px; }
#drop.over { border-color: var(--accent); color: var(--ink); }
.key { color: var(--muted); font-size: 12px; margin-top: 8px; }
.lines { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.lines span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: 3px; margin-right: 5px; background: currentColor; }
#events { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Grid world replay</h1>
  <span id="meta">Load a trace (.jsonl) written by <code>go run ./cmd/judge</code>.</span>
</header>
<div id="drop">Drop a trace file here, or <label><input type="file" id="file" accept=".jsonl,.json,.txt"></label></div>
<main id="app" hidden>
  <section class="panel">
    <div id="gridWrap"><canvas id="grid" width="400" height="400"></canvas></div>
    <div class="controls">
      <button id="back" title="Step back (←)">◀︎</button>
      <button id="play" class="primary" title="Play / pause (space)">Play</button>
      <button id="fwd" title="Step forward (→)">▶︎</button>
      <label>speed <select id="speed">
        <option value="5">5/s</option><option value="20">20/s</option><option value="60" selected>60/s</option>
        <option value="250">250/s</option><option value="1000">1000/s</option><option value="5000">5000/s</option>
      </select></label>
      <label><input type="checkbox" id="heat" checked> heat</label>
      <label><input type="checkbox" id="trail" checked> trail</label>
    </div>
    <div class="controls"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="step"></div>
  </section>
  <section class="panel">
    <dl>
      <dt>step</dt><dd id="vStep">0</dd>
      <dt>action</dt><dd id="vAct">–</dd>
      <dt>true energy</dt><dd id="vE">–</dd>
      <dt>felt</dt><dd id="vF">–</dd>
      <dt>internal</dt><dd id="vI">–</dd>
      <dt>carrying</dt><dd id="vK">–</dd>
    </dl>
    <div class="legend" id="legend"></div>
    <div id="events"></div>
    <div class="key">Space play/pause · ← → step · Shift+← → 100 steps · click the chart to jump.</div>
  </section>
  <section class="panel" style="grid-column: 1 / -1">
    <div class="lines"><span style="color:var(--accent)">true total energy</span><span style="color:var(--felt)">felt by the agent</span><span style="color:var(--inner)">internal energy (scaled)</span></div>
    <canvas id="chart"></canvas>
  </section>
</main>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Trace model. Steps are parsed into flat typed arrays; cell and heat changes
// are stored as (index, value) runs with per-step offsets. Keyframes every K
// steps make seeking O(K) instead of O(steps).
// ---------------------------------------------------------------------------
const K = 400;
const SYMCOL = { ".": "--floor", "#": "--wall" };
const FIXED = { m: "#0f766e", o: "#a16207", f: "#dc2626", a: "#78716c", w: "#0284c7", b: "#4d7c0f", E: "#16a34a", X: "#9333ea", d: "#99f6e4" };
let T = null;   // the loaded trace
let cur = null; // current state {step, cells, field}
let playing = false, acc = 0, lastTs = 0;

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function parse(text) {
  const lines = text.split("\n");
  let header = null;
  const segs = []; // {step, header}
  const n0 = lines.length;
  const t = { a: new Uint8Array(n0), x: new Int16Array(n0), y: new Int16Array(n0), m: new Uint8Array(n0),
    E: new Float32Array(n0), F: new Float32Array(n0), I: new Float32Array(n0), k: new Uint8Array(n0),
    cOff: new Uint32Array(n0 + 1), hOff: new Uint32Array(n0 + 1) };
  let cIdx = [], cVal = [], hIdx = [], hVal = [];
  let n = 0;
  const events = [];
  for (let li = 0; li < lines.length; li++) {
    const s = lines[li];
    if (!s) continue;
    const o = JSON.parse(s);
    if (o.type === "header") {
      header = o;
      segs.push({ step: n, header: o });
      continue;
    }
    if (o.ev) { events.push({ step: n, what: o.ev }); continue; }
    t.a[n] = o.a; t.x[n] = o.x; t.y[n] = o.y; t.m[n] = o.m; t.E[n] = o.E; t.F[n] = o.F; t.I[n] = o.I || 0; t.k[n] = o.k;
    t.cOff[n] = cIdx.length; t.hOff[n] = hIdx.length;
    if (o.c) for (let j = 0; j < o.c.length; j += 2) { cIdx.push(o.c[j]); cVal.push(o.c[j + 1]); }
    if (o.h) for (let j = 0; j < o.h.length; j += 2) { hIdx.push(o.h[j]); hVal.push(o.h[j + 1]); }
    n++;
  }
  if (!segs.length) throw new Error("no header line: is this a trace written by the judge?");
  t.cOff[n] = cIdx.length; t.hOff[n] = hIdx.length;
  t.cIdx = Int32Array.from(cIdx); t.cVal = Uint8Array.from(cVal);
  t.hIdx = Int32Array.from(hIdx); t.hVal = Float32Array.from(hVal);
  t.n = n; t.segs = segs; t.events = events;
  // heat scale: robust max of the field over the trace
  let hmax = 0;
  for (const sg of segs) for (const v of sg.header.field) hmax = Math.max(hmax, v);
  const hv = t.hVal.slice().sort();
  if (hv.length) hmax = Math.max(hmax * 0.5, hv[Math.floor(hv.length * 0.995)]);
  t.hmax = hmax || 1;
  buildKeyframes(t);
  return t;
}

function segAt(t, step) {
  // last segment whose start <= step (state *after* step `step-1`; step 0 = header)
  let s = t.segs[0];
  for (const sg of t.segs) if (sg.step <= step) s = sg; else break;
  return s;
}

function fresh(h) {
  const syms = h.syms;
  const cells = new Uint8Array(h.w * h.h);
  for (let i = 0; i < cells.length; i++) cells[i] = syms.indexOf(h.cells[i]);
  return { step: 0, seg: h, cells, field: Float32Array.from(h.field) };
}

// state index s = number of steps applied (0..n). State s shows the world after step s.
function applyStep(t, st, i) {
  for (let j = t.cOff[i]; j < t.cOff[i + 1]; j++) st.cells[t.cIdx[j]] = t.cVal[j];
  for (let j = t.hOff[i]; j < t.hOff[i + 1]; j++) st.field[t.hIdx[j]] = t.hVal[j];
}

function buildKeyframes(t) {
  t.kf = [];
  let st = null, segStart = -1;
  for (let s = 0; s <= t.n; s++) {
    const sg = segAt(t, s);
    if (!st || sg.step !== segStart) { st = fresh(sg.header); segStart = sg.step; }
    if (s % K === 0) t.kf.push({ cells: st.cells.slice(), field: st.field.slice(), seg: sg.header, segStart });
    if (s < t.n) {
      const nsg = segAt(t, s + 1);
      if (nsg.step !== segStart) continue; // next state starts a new segment
      applyStep(t, st, s);
    }
  }
}

function stateAt(t, s) {
  if (cur && cur.step <= s && s - cur.step < K && segAt(t, s).step === cur.segStart) {
    for (let i = cur.step; i < s; i++) applyStep(t, cur, i);
    cur.step = s;
    return cur;
  }
  const sg = segAt(t, s);
  let base = Math.floor(s / K) * K;
  let st;
  const kf = t.kf[base / K];
  if (kf && kf.segStart === sg.step) {
    st = { cells: kf.cells.slice(), field: kf.field.slice(), seg: kf.seg, segStart: kf.segStart };
  } else {
    const f = fresh(sg.header); base = sg.step; st = { ...f, segStart: sg.step };
  }
  for (let i = base; i < s; i++) applyStep(t, st, i);
  st.step = s;
  cur = st;
  return st;
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
const grid = document.getElementById("grid"), gctx = grid.getContext("2d");
const chart = document.getElementById("chart"), cctx = chart.getContext("2d");
let chartBg = null; // offscreen canvas with the static lines
let cellPx = 20;

function sizeGrid() {
  const h = T.segs[0].header;
  const avail = Math.min(560, Math.max(200, grid.parentElement.clientWidth || 400));
  cellPx = Math.max(6, Math.floor(avail / Math.max(h.w, h.h)));
  const dpr = window.devicePixelRatio || 1;
  grid.width = h.w * cellPx * dpr; grid.height = h.h * cellPx * dpr;
  grid.style.width = h.w * cellPx + "px"; grid.style.height = h.h * cellPx + "px";
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function symColor(ch) { return SYMCOL[ch] ? css(SYMCOL[ch]) : (FIXED[ch] || "#888"); }

function drawGrid(s) {
  const st = stateAt(T, s);
  const h = st.seg, W = h.w, H = h.h, syms = h.syms;
  const cols = [];
  for (let k = 0; k < syms.length; k++) cols.push(symColor(syms[k]));
  const locked = h.locked;
  gctx.clearRect(0, 0, W * cellPx, H * cellPx);
  for (let i = 0; i < W * H; i++) {
    const x = (i % W) * cellPx, y = ((i / W) | 0) * cellPx;
    gctx.fillStyle = cols[st.cells[i]] || "#888";
    gctx.fillRect(x, y, cellPx, cellPx);
  }
  // grid lines (one path)
  gctx.strokeStyle = css("--line"); gctx.lineWidth = 1; gctx.beginPath();
  for (let x = 0; x <= W; x++) { gctx.moveTo(x * cellPx + .5, 0); gctx.lineTo(x * cellPx + .5, H * cellPx); }
  for (let y = 0; y <= H; y++) { gctx.moveTo(0, y * cellPx + .5); gctx.lineTo(W * cellPx, y * cellPx + .5); }
  gctx.stroke();
  // heat overlay
  if (document.getElementById("heat").checked) {
    for (let i = 0; i < W * H; i++) {
      const v = st.field[i];
      if (v <= 0) continue;
      const a = Math.min(1, Math.sqrt(v / T.hmax));
      const x = (i % W) * cellPx, y = ((i / W) | 0) * cellPx;
      // inset so the cell's own symbol still shows as a frame
      const ins = Math.max(2, Math.round(cellPx * 0.2));
      gctx.fillStyle = `rgba(255,${Math.round(140 - 120 * a)},0,${0.35 + 0.6 * a})`;
      gctx.fillRect(x + ins, y + ins, cellPx - 2 * ins, cellPx - 2 * ins);
    }
  }
  const si = Math.max(0, s - 1); // position after step s (state 0: header position)
  const ax = s === 0 ? h.x : T.x[si], ay = s === 0 ? h.y : T.y[si];
  // view square
  const R = T.segs[0].header.radius;
  gctx.strokeStyle = css("--felt"); gctx.lineWidth = 1.5; gctx.setLineDash([4, 3]);
  gctx.strokeRect((ax - R) * cellPx + .75, (ay - R) * cellPx + .75, (2 * R + 1) * cellPx - 1.5, (2 * R + 1) * cellPx - 1.5);
  gctx.setLineDash([]);
  // trail
  if (document.getElementById("trail").checked && s > 1) {
    gctx.strokeStyle = css("--felt"); gctx.globalAlpha = 0.45; gctx.lineWidth = Math.max(1.5, cellPx / 8);
    gctx.beginPath();
    const from = Math.max(segAt(T, s).step, s - 60);
    for (let i = from; i < s; i++) {
      const px = T.x[i] * cellPx + cellPx / 2, py = T.y[i] * cellPx + cellPx / 2;
      if (i === from) gctx.moveTo(px, py); else gctx.lineTo(px, py);
    }
    gctx.stroke(); gctx.globalAlpha = 1;
  }
  // agent
  gctx.fillStyle = css("--ink");
  gctx.beginPath(); gctx.arc(ax * cellPx + cellPx / 2, ay * cellPx + cellPx / 2, cellPx * 0.32, 0, Math.PI * 2); gctx.fill();
  const k = s === 0 ? 0 : T.k[si];
  if (k) { gctx.fillStyle = cols[k]; gctx.fillRect(ax * cellPx + cellPx * 0.36, ay * cellPx + cellPx * 0.36, cellPx * 0.28, cellPx * 0.28); }
  if (s > 0 && !T.m[si]) { // last action had no effect
    gctx.strokeStyle = css("--accent"); gctx.lineWidth = 2;
    gctx.beginPath(); gctx.arc(ax * cellPx + cellPx / 2, ay * cellPx + cellPx / 2, cellPx * 0.42, 0, Math.PI * 2); gctx.stroke();
  }
}

function buildChart() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(200, chart.clientWidth), h = 150;
  chart.width = w * dpr; chart.height = h * dpr;
  chartBg = document.createElement("canvas");
  chartBg.width = w * dpr; chartBg.height = h * dpr;
  const c = chartBg.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = T.n; if (!n) return;
  let top = 0, itop = 0;
  for (let i = 0; i < n; i++) { top = Math.max(top, T.E[i], T.F[i]); itop = Math.max(itop, T.I[i]); }
  top = top || 1;
  const pad = 18, ph = h - pad - 4;
  c.strokeStyle = css("--line"); c.lineWidth = 1; c.beginPath();
  for (const f of [0, .5, 1]) { const y = 4 + ph * (1 - f) + .5; c.moveTo(0, y); c.lineTo(w, y); }
  c.stroke();
  c.fillStyle = css("--muted"); c.font = "11px ui-sans-serif, system-ui";
  c.fillText(top.toFixed(1), 2, 14); c.fillText("0", 2, h - pad - 2);
  c.fillText("step " + n, w - 70, h - 4);
  // min/max envelope per pixel column, drawn as one path per series
  const series = [[T.F, css("--felt"), top], [T.E, css("--accent"), top]];
  if (itop > 0) series.unshift([T.I, css("--inner"), itop]);
  for (const [arr, col, sc] of series) {
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 1.25; c.beginPath();
    let first = true;
    for (let px = 0; px < w; px++) {
      const a = Math.floor(px * n / w), b = Math.max(a + 1, Math.floor((px + 1) * n / w));
      let lo = Infinity, hi = -Infinity, sum = 0;
      for (let i = a; i < b && i < n; i++) { const v = arr[i]; if (v < lo) lo = v; if (v > hi) hi = v; sum += v; }
      const yl = 4 + ph * (1 - lo / sc), yh = 4 + ph * (1 - hi / sc);
      if (first) { c.moveTo(px, yh); first = false; }
      c.lineTo(px, yh); c.lineTo(px, yl);
    }
    c.stroke();
  }
  for (const ev of T.events) {
    const x = ev.step / n * w; c.strokeStyle = css("--muted"); c.setLineDash([2, 2]);
    c.beginPath(); c.moveTo(x, 4); c.lineTo(x, h - pad); c.stroke(); c.setLineDash([]);
  }
}

function drawChart(s) {
  const dpr = window.devicePixelRatio || 1;
  cctx.setTransform(1, 0, 0, 1, 0, 0);
  cctx.clearRect(0, 0, chart.width, chart.height);
  cctx.drawImage(chartBg, 0, 0);
  const w = chart.width / dpr;
  const x = T.n ? s / T.n * w : 0;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cctx.strokeStyle = css("--cursor"); cctx.lineWidth = 1;
  cctx.beginPath(); cctx.moveTo(x + .5, 0); cctx.lineTo(x + .5, 150 - 18); cctx.stroke();
}

const $ = id => document.getElementById(id);
let shown = -1;
function render(s) {
  s = Math.max(0, Math.min(T.n, s | 0));
  drawGrid(s); drawChart(s);
  const si = s - 1, h = segAt(T, s).header;
  $("vStep").textContent = s + " / " + T.n;
  $("vAct").textContent = s ? h.actions[T.a[si]] + (T.m[si] ? "" : " (no effect)") : "–";
  $("vE").textContent = (s ? T.E[si] : h.E).toFixed(2);
  $("vF").textContent = s ? T.F[si].toFixed(2) : "–";
  $("vI").textContent = s ? T.I[si].toFixed(3) : "–";
  $("vK").textContent = s && T.k[si] ? h.symNames[T.k[si]] : "nothing";
  $("scrub").value = s;
  shown = s;
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
function setPlaying(p) { playing = p; $("play").textContent = p ? "Pause" : "Play"; if (p) { lastTs = 0; acc = 0; requestAnimationFrame(tick); } }
function tick(ts) {
  if (!playing) return;
  if (lastTs) acc += (ts - lastTs) / 1000 * +$("speed").value;
  lastTs = ts;
  const adv = Math.floor(acc);
  if (adv > 0) {
    acc -= adv;
    const next = Math.min(T.n, shown + adv);
    render(next);
    if (next >= T.n) { setPlaying(false); return; }
  }
  requestAnimationFrame(tick);
}

function load(text, name) {
  const t0 = performance.now();
  T = parse(text); cur = null;
  const h = T.segs[0].header;
  $("drop").hidden = true; $("app").hidden = false;
  $("meta").textContent = `${name || ""} · ${h.env} · ${h.agent} · ${h.feel} feel · ${T.n} steps · ${h.desc}`;
  $("scrub").max = T.n;
  const lg = $("legend"); lg.innerHTML = "";
  for (let k = 0; k < h.syms.length; k++) {
    const sp = document.createElement("span");
    sp.innerHTML = `<i class="sw" style="background:${symColor(h.syms[k])}"></i>${h.symNames[k]}`;
    lg.appendChild(sp);
  }
  const heat = document.createElement("span"); heat.innerHTML = `<i class="sw" style="background:rgba(255,40,0,.7)"></i>energy (heat)`; lg.appendChild(heat);
  $("events").textContent = T.events.length ? "events: " + T.events.map(e => `${e.what} @${e.step}`).join(", ") : "";
  sizeGrid(); buildChart(); render(0);
  window.__replay = { steps: T.n, parseMs: performance.now() - t0, render, get shown() { return shown; }, state: s => stateAt(T, s), trace: T };
}

$("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) f.text().then(t => load(t, f.name)); });
const drop = $("drop");
for (const ev of ["dragenter", "dragover"]) document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); });
document.addEventListener("dragleave", () => drop.classList.remove("over"));
document.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(t, f.name)); });
$("play").onclick = () => { if (shown >= T.n) render(0); setPlaying(!playing); };
$("back").onclick = () => { setPlaying(false); render(shown - 1); };
$("fwd").onclick = () => { setPlaying(false); render(shown + 1); };
$("scrub").oninput = e => render(+e.target.value);
$("heat").onchange = () => render(shown);
$("trail").onchange = () => render(shown);
function chartSeek(e) { const r = chart.getBoundingClientRect(); render(Math.round((e.clientX - r.left) / r.width * T.n)); }
chart.addEventListener("pointerdown", e => { chartSeek(e); chart.setPointerCapture(e.pointerId); });
chart.addEventListener("pointermove", e => { if (e.buttons) chartSeek(e); });
document.addEventListener("keydown", e => {
  if (!T || e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); setPlaying(false); render(shown + (e.shiftKey ? 100 : 1)); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); setPlaying(false); render(shown - (e.shiftKey ? 100 : 1)); }
});
let rz; window.addEventListener("resize", () => { if (!T) return; clearTimeout(rz); rz = setTimeout(() => { sizeGrid(); buildChart(); render(shown); }, 120); });
// ?trace=<url> loads a trace directly (works when the page is served over http)
const q = new URLSearchParams(location.search).get("trace");
if (q) fetch(q).then(r => r.text()).then(t => load(t, q.split("/").pop())).catch(err => { $("meta").textContent = "could not load " + q + ": " + err; });
</script>
</body>
</html>
